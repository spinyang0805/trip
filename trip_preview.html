// ── CURRENCY (project-scoped; managed in expenses.html) ─
const CURRENCY_SYMBOLS = {
  JPY:'¥', TWD:'NT$', USD:'$', EUR:'€', KRW:'₩', CNY:'¥', HKD:'HK$',
  THB:'฿', VND:'₫', GBP:'£', AUD:'A$', SGD:'S$'
};
function symbolFor(code) { return CURRENCY_SYMBOLS[code] || (code + ' '); }
let baseCurrency = 'JPY';
let currencyRates = {};

function convert(amount, from, to) {
  if (from === to) return amount;
  const rf = currencyRates[from]?.rateToTWD, rt = currencyRates[to]?.rateToTWD;
  if (!rf || !rt) return null;
  return amount * rf / rt;
}
function toBase(amount, currency) {
  if (!currency || currency === baseCurrency) return amount;
  const v = convert(amount, currency, baseCurrency);
  return v === null ? amount : v;
}

function loadCurrencySettings() {
  onValue(ref(db, `projects/${projectId}/baseCurrency`), snap => {
    baseCurrency = snap.val() || 'JPY';
    updateBudgetBar();
    if (tripLoaded) renderWhenIdle();
  });
  onValue(ref(db, `projects/${projectId}/currencyRates`), snap => {
    currencyRates = snap.val() || {};
    updateBudgetBar();
    if (tripLoaded) renderWhenIdle();
  });
}
let tripData    = { title: '', budget: 0, days: {} };
let map, directionsService;
let allMarkers  = [];
let activeDay   = null;
let dragSrc     = null;
let mapVisible  = false;

// ── AUTH ─────────────────────────────────────
onAuthStateChanged(auth, async user => {
  if (!user) { location.href = 'index.html'; return; }
  currentUser = user;
  // 連不上網路時,5 秒內沒拿到資料就先顯示這台裝置上次存的行程
  setTimeout(showCachedTrip, navigator.onLine ? 5000 : 0);
  const snap = await get(ref(db, `users/${user.uid}`));
  const ud = snap.val();
  if (!ud || (ud.status !== 'approved' && !ud.isAdmin)) { location.href = 'index.html'; return; }
  const projSnap = await get(ref(db, `projects/${projectId}`));
  projectMeta = projSnap.val();
  const isMember = projectMeta && (
    ud.isAdmin ||
    projectMeta.ownerId === user.uid ||
    projectMeta.members?.[user.uid]?.status === 'approved'
  );
  if (!isMember) { location.href = 'index.html'; return; }
  currentUd = ud;
  document.getElementById('user-name').textContent = ud.name || '';
  if (ud.isAdmin || projectMeta?.ownerId === user.uid) {
    document.getElementById('btn-members').style.display = '';
  }
  loadCurrencySettings();
  loadTrip();
  loadPhotos();
  loadExpenses();
  loadDocs();
});

// ── LOAD TRIP ─────────────────────────────────
let tripLoaded = false;

function loadTrip() {
  onValue(ref(db, `trips/${projectId}`), snap => {
    tripData = snap.val() || { title: projectMeta?.title || '', budget: 0, days: {} };
    document.getElementById('trip-title').value = tripData.title || projectMeta?.title || '';
    document.getElementById('budget-total').value = tripData.budget || '';
    tripLoaded = true;
    if (offlineMode) {
      offlineMode = false;
      document.body.classList.remove('readonly');
      document.getElementById('offline-bar').style.display = 'none';
    }
    cacheTrip();
    renderWhenIdle();
    if (urlParams.get('open') === 'info' && !loadTrip._opened) { loadTrip._opened = true; openInfo(); }
  });
}

// 使用者正在行程欄位輸入時先不重畫(重畫會換掉 input,焦點/時間選擇器會跳掉),
// 等焦點離開所有欄位後再補畫一次
// 手機開原生時間/日期選擇器時整個網頁會失焦(activeElement 可能變成 body),
// 那不算離開欄位,所以用 editingEl 記住最後編輯的欄位,只有網頁仍有焦點時的 focusout 才清掉
let renderPending = false;
let editingEl = null;
function isItinField(el) {
  return !!(el && /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName) && el.closest('#days-container, #pool-container'));
}
function isEditingItinerary() {
  return isItinField(document.activeElement) || !!(editingEl && editingEl.isConnected);
}
function renderWhenIdle() {
  if (!isEditingItinerary()) { renderAll(); return; }
  renderPending = true;
}
document.addEventListener('focusin', e => { if (isItinField(e.target)) editingEl = e.target; });
document.addEventListener('focusout', () => {
  if (!document.hasFocus()) return;   // 網頁失焦(原生選擇器、切 App),不是離開欄位
  setTimeout(() => {
    if (!document.hasFocus() || isItinField(document.activeElement)) return;
    editingEl = null;
    if (renderPending) { renderPending = false; renderAll(); }
  }, 0);
});

function save() {
  if (offlineMode) { showToast('📴 離線模式無法修改'); return; }
  set(ref(db, `trips/${projectId}`), tripData);
}

function saveMeta() {
  tripData.title  = document.getElementById('trip-title').value;

  save();
  if (tripData.title) update(ref(db, `projects/${projectId}`), { title: tripData.title });
  updateBudgetBar();
}
window.saveMeta = saveMeta;

// ── RENDER ALL ────────────────────────────────
function renderAll() {
  const dayKeys = Object.keys(tripData.days || {}).sort();
  const container = document.getElementById('days-container');
  renderPool();
  updateChecklistBadge();
  if (isModalOpen('info-modal-mask')) renderInfo();
  if (isModalOpen('check-modal-mask')) renderChecklist();

  if (dayKeys.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="ei">✈️</div><p>點擊「新增天數」開始規劃行程</p></div>`;
    updateBudgetBar();
    renderMapTabs([]);
    return;
  }

  loadCollapseState(dayKeys);
  const today = todayStr();
  const todayDay = dayKeys.find(k => tripData.days[k].date === today) || null;
  document.getElementById('btn-today').style.display = todayDay ? '' : 'none';
  // 旅程期間第一次打開:只展開今天、地圖聚焦今天(不寫進收合偏好)
  let scrollToday = false;
  if (todayDay && !todayApplied) {
    todayApplied = true;
    dayKeys.forEach(k => { collapsedDays[k] = k !== todayDay; });
    visibleDays.clear(); visibleDays.add(todayDay); activeDay = todayDay;
    scrollToday = true;
  }

  let nextInfo = null;
  container.innerHTML = dayKeys.map((dayId, idx) => {
    const day   = tripData.days[dayId];
    const spots = getSpotsArray(day);
    const color = DAY_COLORS[idx % DAY_COLORS.length];
    const totalCost = spots.reduce((s, sp) => s + toBase(parseFloat(sp.cost)||0, sp.costCurrency||baseCurrency), 0);
    const collapsed = !!collapsedDays[dayId];
    const isToday = dayId === todayDay;
    const sched = computeSchedule(day);
    const nextId = isToday ? findNextSpot(spots, sched) : null;
    if (nextId) nextInfo = { dayId, sp: spots.find(s => s.id === nextId), arrive: sched[nextId]?.arrive };
    if (!collapsed) requestLegs(dayId);
    const summary = spots.length
      ? `${spots.length} 個景點${spots[0]?.name ? '｜' + esc(spots[0].name) + (spots.length > 1 ? ' → ' + esc(spots[spots.length-1].name) : '') : ''}`
      : '尚無景點';
    return `
    <div class="day-card ${collapsed ? 'collapsed' : ''} ${isToday ? 'today' : ''}" data-day="${dayId}">
      <div class="day-hd" style="border-left:4px solid ${color}" onclick="toggleDayCollapse('${dayId}', event)">
        <div class="day-hd-left">
          <span class="day-chevron">${collapsed ? '▸' : '▾'}</span>
          <span class="day-pill" style="background:${color}22;color:${color}">Day ${idx+1}</span>
          ${isToday ? '<span class="today-pill">今天</span>' : ''}
          <input class="day-date" type="date" value="${day.date||''}" onchange="updateDayDate('${dayId}',this.value)">
          <span class="day-wx" id="wx-${dayId}">${wxHtml(dayId)}</span>
        </div>
        <div class="day-hd-right">
          <span class="day-cost" style="color:${color}" title="預估">${symbolFor(baseCurrency)}${Math.round(totalCost).toLocaleString()}</span>
          <button class="btn-ic" title="照片" onclick="openPhotos('${dayId}')">📸</button>
          <button class="btn-map-day" style="background:${color}" onclick="showDayOnMap('${dayId}')">🗺 地圖</button>
          <button class="btn-ic danger" title="刪除這天" onclick="deleteDay('${dayId}')">🗑</button>
        </div>
      </div>
      ${collapsed ? `<div class="day-summary" onclick="toggleDayCollapse('${dayId}')">${summary}</div>` : ''}
      <ul class="spots-list" id="spots-${dayId}">
        ${spots.map((sp, i) => renderSpot(dayId, sp, i, color, spots.length, sched[sp.id], sp.id === nextId)).join('')}
      </ul>
      <div class="add-spot-row">
        <input class="add-spot-inp" id="new-${dayId}" placeholder="輸入景點名稱後 Enter…" onkeydown="if(event.key==='Enter')quickAdd('${dayId}')">
        <select class="add-type-sel" id="type-${dayId}">
          ${Object.entries(SPOT_TYPES).map(([k,v])=>`<option value="${k}">${v.icon} ${v.label}</option>`).join('')}
        </select>
        <button class="btn-add-spot" style="background:${color}" onclick="quickAdd('${dayId}')">新增</button>
      </div>
    </div>`;
  }).join('');

  renderNextBar(nextInfo);
  renderMapTabs(dayKeys);
  updateBudgetBar();
  loadWeather(dayKeys);

  if (visibleDays.size === 0 && dayKeys.length && !renderAll._userHidAll) {
    visibleDays.add(dayKeys[0]);
    activeDay = dayKeys[0];
  }
  if (activeDay && !tripData.days[activeDay]) activeDay = [...visibleDays][0] || null;
  if (map) drawVisibleDays();
  if (scrollToday) setTimeout(() => jumpToToday(), 50);
}

const SPOT_TYPES = {
  attraction: { icon:'🗺️', label:'景點', color:'#4a7c59' },
  meal:       { icon:'🍜', label:'餐廳', color:'#c4783a' },
  snack:      { icon:'🍡', label:'小吃', color:'#d4a843' },
  transport:  { icon:'🚗', label:'交通', color:'#2e6da4' },
  hotel:      { icon:'🏨', label:'住宿', color:'#8e44ad' },
  ticket:     { icon:'🎟️', label:'門票', color:'#c0392b' },
  parking:    { icon:'🅿️', label:'停車', color:'#1a6b8a' },
  toll:       { icon:'🛣️', label:'過路費', color:'#6d4c41' },
  shopping:   { icon:'🛍️', label:'購物', color:'#e91e8c' },
  scenery:    { icon:'🌸', label:'風景', color:'#16a085' },
  activity:   { icon:'🎡', label:'活動', color:'#f57c00' },
  gas:        { icon:'⛽', label:'加油', color:'#546e7a' },
};

const DAY_COLORS = ['#4a7c59','#c4783a','#2e6da4','#8e44ad','#c0392b','#16a085','#d4a843','#1a6b8a'];

function renderSpot(dayId, sp, i, dayColor, total, sch = {}, isNext = false) {
  const t = SPOT_TYPES[sp.type] || SPOT_TYPES.attraction;
  const isLast = i === total - 1;
  const open = openSpot === dayId + '/' + sp.id;
  const dayKeys = Object.keys(tripData.days || {}).sort();
  const moveOptions = dayKeys.filter(k => k !== dayId)
    .map(k => `<option value="${k}">移至 Day ${dayKeys.indexOf(k)+1}</option>`).join('');

  let warnHtml = '';
  const dayDate = tripData.days[dayId]?.date;
  const checkTime = sp.time || (sch.eta != null ? minToHm(sch.eta) : '');
  if (sp.poiId && dayDate && checkTime) {
    const closed = isSpotClosed(sp.poiId, dayDate, checkTime);
    if (closed === true) {
      const dow = new Date(dayDate + 'T00:00:00').getDay();
      const hoursTxt = hoursTextForDow(sp.poiId, dow);
      warnHtml = `<span class="spot-warn" title="當日營業時間：${esc(hoursTxt)}">⚠️ 可能未營業</span>`;
    }
  }
  if (sch.late != null) warnHtml += `<span class="spot-warn" title="依前一站時間+停留+車程推算">⚠️ 預計 ${minToHm(sch.late)} 才到</span>`;

  const timeHtml = sp.time
    ? `<span class="sc-time">${sp.time}</span>`
    : sch.eta != null ? `<span class="sc-time eta" title="依前一站時間+停留+車程推算">約 ${minToHm(sch.eta)}</span>` : '';
  const stay = parseInt(sp.stay) || 0;
  const cost = parseFloat(sp.cost) || 0;
  const booked = sp.expenseId && expensesCache[sp.expenseId];

  return `
  <li class="spot-item ${open ? 'open' : ''} ${isNext ? 'is-next' : ''}" data-spot="${sp.id}" data-day="${dayId}">
    <div class="spot-left">
      <div class="spot-num" style="background:${dayColor}">${i+1}</div>
      ${!isLast ? `<div class="spot-line" style="background:${dayColor}"></div>` : ''}
    </div>
    <div class="spot-type-icon" style="background:${t.color}22;color:${t.color}" title="${t.label}">${t.icon}</div>
    <div class="spot-body" onclick="toggleSpot('${dayId}','${sp.id}')">
      <div class="sc-row1">
        <span class="sc-name">${esc(sp.name || '(未命名)')}</span>
        ${isNext ? '<span class="next-pill">下一站</span>' : ''}
      </div>
      <div class="sc-row2">
        ${timeHtml}
        ${stay ? `<span class="sc-stay">停 ${fmtStay(stay)}</span>` : ''}
        ${cost ? `<span class="sc-cost">${symbolFor(sp.costCurrency||baseCurrency)}${cost.toLocaleString()}</span>` : ''}
        ${booked ? '<span class="sc-booked" title="已記入費用頁">✓ 已記帳</span>' : ''}
        ${!sp.lat ? '<span class="sc-nogeo" title="沒有定位,地圖與車程不會計算">📍 未定位</span>' : ''}
        ${sp.note ? `<span class="sc-note">${esc(sp.note)}</span>` : ''}
      </div>
      ${warnHtml ? `<div class="sc-row2">${warnHtml}</div>` : ''}
    </div>
    <div class="spot-side">
      ${sp.lat ? `<button class="btn-spot-nav" title="從目前位置導航到這裡" onclick="navigateTo('${dayId}','${sp.id}')">🧭</button>` : ''}
      <button class="btn-spot-toggle" title="${open ? '收合' : '編輯'}" onclick="toggleSpot('${dayId}','${sp.id}')">${open ? '▴' : '✎'}</button>
    </div>
    ${open ? `
    <div class="spot-edit">
      <div class="se-row">
        <input class="spot-name-inp" value="${esc(sp.name||'')}" placeholder="景點名稱"
          onchange="updateSpot('${dayId}','${sp.id}','name',this.value)"
          onblur="geocodeSpot('${dayId}','${sp.id}',this.value)">
        <select class="spot-type-sel" onchange="updateSpot('${dayId}','${sp.id}','type',this.value)">
          ${Object.entries(SPOT_TYPES).map(([k,v])=>`<option value="${k}" ${sp.type===k?'selected':''}>${v.icon} ${v.label}</option>`).join('')}
        </select>
      </div>
      <div class="se-row">
        <label class="se-field">到達
          <input class="spot-time" type="time" value="${sp.time||''}"
            onchange="updateSpot('${dayId}','${sp.id}','time',this.value)"></label>
        <label class="se-field">停留(分)
          <input class="spot-stay" type="number" min="0" step="15" inputmode="numeric" value="${stay || ''}" placeholder="0"
            onchange="updateSpot('${dayId}','${sp.id}','stay',this.value)"></label>
        <label class="se-field">費用
          <span class="spot-cost-wrap">
            <input class="spot-cost" type="number" inputmode="decimal" value="${sp.cost||''}" placeholder="0"
              onchange="updateSpot('${dayId}','${sp.id}','cost',this.value)">
            <select class="spot-cur-sel" onchange="updateSpot('${dayId}','${sp.id}','costCurrency',this.value)">
              ${Object.keys(CURRENCY_SYMBOLS).map(c => `<option value="${c}" ${(sp.costCurrency||baseCurrency)===c?'selected':''}>${c}</option>`).join('')}
            </select>
          </span></label>
      </div>
      <input class="spot-note" value="${esc(sp.note||'')}" placeholder="備註…"
        onchange="updateSpot('${dayId}','${sp.id}','note',this.value)">
      ${sp.type === 'toll' ? `
      <label class="toggle-label">
        <input type="checkbox" ${sp.avoidToll?'checked':''} onchange="updateSpot('${dayId}','${sp.id}','avoidToll',this.checked)">
        避開付費路段
      </label>` : ''}
      <div class="se-actions">
        <button class="btn-ic" onclick="openPoiDetail('${dayId}','${sp.id}')">📖 詳情</button>
        <button class="btn-ic" onclick="openExpenseModal('${dayId}','${sp.id}')">💳 ${booked ? '再記一筆' : '記帳'}</button>
        ${moveOptions ? `<select class="spot-move-sel" onchange="moveSpotToDay('${dayId}','${sp.id}',this.value)">
          <option value="">⇄ 移到…</option>${moveOptions}
        </select>` : ''}
        <button class="btn-ic danger" onclick="deleteSpot('${dayId}','${sp.id}')">🗑 刪除</button>
      </div>
    </div>` : ''}
  </li>`;
}

// ── SHARED STATE / UTILS ──────────────────────
let offlineMode   = false;
let expensesCache = {};     // expenses/{pid}:費用頁的實際記帳
let openSpot      = null;   // 'dayId/spotId':目前展開編輯的景點卡
let todayApplied  = false;

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function hmToMin(t) {
  if (!t) return null;
  const [h, m] = t.split(':').map(Number);
  return isNaN(h) ? null : h * 60 + (m || 0);
}
function minToHm(m) {
  m = ((Math.round(m) % 1440) + 1440) % 1440;
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
}
function fmtStay(m) {
  if (m < 60) return `${m} 分`;
  return m % 60 ? `${Math.floor(m / 60)} 小時 ${m % 60} 分` : `${m / 60} 小時`;
}
function isModalOpen(id) { return document.getElementById(id)?.classList.contains('open'); }

// ── SCHEDULE:到達時間 + 停留 + 車程 → 推算下一站 ──
const legPending = new Set(), legFailed = new Set();
function legKey(a, b, avoid) { return `${a.lat},${a.lng}>${b.lat},${b.lng}|${avoid ? 1 : 0}`; }
function legSeconds(a, b, avoid) {
  return dirCache.get(legKey(a, b, avoid))?.routes?.[0]?.legs?.[0]?.duration?.value ?? null;
}
// 背景查各段車程(與地圖共用 dirCache),查到後重畫一次讓預估時間出現
let legRerenderTimer = null;
function requestLegs(dayId) {
  if (!directionsService || !tripData.days?.[dayId]) return;
  const spots = getSpotsArray(tripData.days[dayId]).filter(s => s.lat && s.lng);
  const avoid = spots.some(s => s.avoidToll);
  for (let i = 0; i < spots.length - 1; i++) {
    const a = spots[i], b = spots[i + 1], k = legKey(a, b, avoid);
    if (dirCache.has(k) || legPending.has(k) || legFailed.has(k) || haversineKm(a, b) > 300) continue;
    legPending.add(k);
    directionsService.route({
      origin: { lat: a.lat, lng: a.lng }, destination: { lat: b.lat, lng: b.lng },
      travelMode: google.maps.TravelMode.DRIVING, avoidTolls: avoid,
    }, (res, status) => {
      legPending.delete(k);
      if (status !== 'OK') { legFailed.add(k); return; }
      dirCache.set(k, res);
      clearTimeout(legRerenderTimer);
      legRerenderTimer = setTimeout(renderWhenIdle, 400);
    });
  }
}
function computeSchedule(day) {
  const spots = getSpotsArray(day);
  const avoid = spots.filter(s => s.lat && s.lng).some(s => s.avoidToll);
  const out = {};
  let depart = null, prev = null;
  spots.forEach(sp => {
    let cursor = null;
    if (prev && depart != null && sp.lat && sp.lng && prev.lat && prev.lng) {
      const sec = legSeconds(prev, sp, avoid);
      if (sec != null) cursor = depart + sec / 60;
    }
    const r = {};
    const t = hmToMin(sp.time);
    if (t != null) {
      r.arrive = t;
      if (cursor != null && cursor > t + 5) r.late = cursor;
    } else if (cursor != null) {
      r.arrive = r.eta = cursor;
    }
    out[sp.id] = r;
    depart = r.arrive != null ? r.arrive + (parseInt(sp.stay) || 0) : null;
    prev = sp;
  });
  return out;
}

  const now = new Date().getHours() * 60 + new Date().getMinutes();
  return spots.find(s => sched[s.id]?.arrive != null && sched[s.id].arrive >= now)?.id || null;
}

// ── WEATHER(Open-Meteo,免 key,只抓 16 天內)──
const wxCache = {};
// 用當天最後一個有定位的景點(通常是住宿/目的地),避免抓到出發地機場
function wxSpot(dayId) {
  const day = tripData.days?.[dayId];
  if (!day?.date) return null;
  return [...getSpotsArray(day)].reverse().find(s => s.lat && s.lng) || null;
}
function wxKey(dayId) {
  const sp = wxSpot(dayId);
  return sp ? `${sp.lat.toFixed(2)},${sp.lng.toFixed(2)},${tripData.days[dayId].date}` : null;
}
function wxIcon(c) {
  return c === 0 ? '☀️' : c <= 2 ? '🌤️' : c === 3 ? '☁️' : c <= 48 ? '🌫️' : c <= 57 ? '🌦️'
    : c <= 67 ? '🌧️' : c <= 77 ? '🌨️' : c <= 82 ? '🌧️' : '⛈️';
}
function wxHtml(dayId) {
  const v = wxCache[wxKey(dayId)];
  return v && v !== 'loading' ? v : '';
}
function loadWeather(dayKeys) {
  const t0 = new Date(todayStr() + 'T00:00:00');
  dayKeys.forEach(dayId => {
    const k = wxKey(dayId);
    if (!k || k in wxCache) return;
    const [lat, lng, date] = k.split(',');
    const diff = (new Date(date + 'T00:00:00') - t0) / 864e5;
    if (diff < 0 || diff > 15) return;
    wxCache[k] = 'loading';
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&start_date=${date}&end_date=${date}`)
      .then(r => r.json())
      .then(j => {
        const d = j.daily;
        if (!d?.time?.length) { wxCache[k] = ''; return; }
        const rain = d.precipitation_probability_max?.[0];
        const place = wxSpot(dayId)?.name || '';
        wxCache[k] = `<span title="${esc(place)} 的天氣預報(Open-Meteo)">${wxIcon(d.weather_code[0])} ${Math.round(d.temperature_2m_max[0])}°/${Math.round(d.temperature_2m_min[0])}°${rain != null ? ` ☔${rain}%` : ''}<span class="wx-place">📍${esc(place.length > 8 ? place.slice(0, 8) + '…' : place)}</span></span>`;
        const el = document.getElementById('wx-' + dayId);
        if (el) el.innerHTML = wxCache[k];
      })
      .catch(() => { wxCache[k] = ''; });
  });
}

function renderInfo() {
  const items = Object.entries(tripData.info || {});
  const docs = Object.entries(docsCache).filter(([id]) => !pendingDocDelete.has(id))
    .sort((a, b) => (a[1].uploadedAt || 0) - (b[1].uploadedAt || 0));
  const el = document.getElementById('info-list');
  if (!items.length && !docs.length) {
    el.innerHTML = '<div class="pm-empty">還沒有資料。把航班、訂房代號、飯店電話、租車確認、緊急聯絡人記在這裡,電子機票、訂房確認信也可以直接上傳,全家都看得到。</div>';
    return;
  }
  let html = Object.keys(INFO_CATS).map(cat => {
    const list = items.filter(([, it]) => (it.cat || 'other') === cat).sort((a, b) => (a[1].createdAt || 0) - (b[1].createdAt || 0));
    const catDocs = docs.filter(([, d]) => docCat(d) === cat);
    if (!list.length && !catDocs.length) return '';
    return `<div class="ii-cat">${INFO_CATS[cat]}</div>` + list.map(([id, it]) => `
      <div class="info-item">
        <div class="ii-head"><b>${esc(it.title || '')}</b>
          ${offlineMode ? '' : `<button class="btn-ic" onclick="editInfoItem('${id}')">✏️</button>
          <button class="btn-ic danger" onclick="deleteInfoItem('${id}')">🗑</button>`}
        </div>
        ${it.body ? `<div class="ii-body">${linkify(esc(it.body))}</div>` : ''}
      </div>`).join('') + catDocs.map(([id, d]) => docRowHtml(id, d)).join('');
  }).join('');

  // 景點詳情頁上傳、還沒歸類的文件:依景點分組
  const poiDocs = docs.filter(([, d]) => docCat(d) === null);
  if (poiDocs.length) {
    const groups = new Map();
    poiDocs.forEach(([id, d]) => { if (!groups.has(d.spotPoiId)) groups.set(d.spotPoiId, []); groups.get(d.spotPoiId).push([id, d]); });
    html += '<div class="ii-cat">📍 景點文件</div>' + [...groups.entries()].map(([pid, list]) => `
      <div class="doc-poi"><a href="poi.html?id=${pid}&project=${projectId}">${esc(poisCache[pid]?.name || '未知景點')}</a></div>` +
      list.map(([id, d]) => docRowHtml(id, d)).join('')).join('');
  }
  el.innerHTML = html;
}

window.uploadInfoDocs = async function(files) {
  if (!files?.length) return;
  if (offlineMode) { showToast('📴 離線模式無法上傳'); return; }
  const cat = document.getElementById('info-cat').value;
  for (const file of files) {
    if (file.size > 10 * 1048576) { showToast(`「${file.name}」超過 10MB 上限`); continue; }
    try {
      showToast(`上傳中：${file.name}…`);
      const docId = 'doc_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
      const path = `projects/${projectId}/docs/${docId}_${file.name}`;
      await uploadBytes(sRef(storage, path), file, { contentType: file.type || 'application/octet-stream' });
      const url = await getDownloadURL(sRef(storage, path));
      await set(ref(db, `docs/${projectId}/${docId}`), {
        infoCat: cat, spotPoiId: null,
        fileName: file.name, url, storagePath: path,
        size: file.size, mime: file.type || '',
        uploadedBy: currentUser.uid, uploaderName: currentUd?.name || '',
        uploadedAt: Date.now()
      });
      showToast(`已上傳：${file.name} ✓`);
    } catch (e) {
      console.error(e);
      showToast('上傳失敗：' + (e.code || e.message || ''));
      break;
    }
  }
  document.getElementById('info-file').value = '';
};
window.deleteDoc = function(id) {
  const d = docsCache[id];
  if (!d) return;
  const timer = setTimeout(async () => {
    pendingDocDelete.delete(id);
    try { if (d.storagePath) await deleteObject(sRef(storage, d.storagePath)); } catch (e) {}
    await remove(ref(db, `docs/${projectId}/${id}`));
  }, 6500);
  pendingDocDelete.set(id, timer);
  renderInfo();
  showUndo(`已刪除「${d.fileName}」`, () => {
    clearTimeout(pendingDocDelete.get(id));
    pendingDocDelete.delete(id);
    renderInfo();
  });
};

    };

window.__onMapsReady = initMapReal;
if (window.__mapsReady) initMapReal();

// Tiles stall if the container's layout shifts right after init.
// The modern Maps API ignores the legacy 'resize' trigger and its
// 'tilesloaded' event fires even while the basemap is stuck, so the
// only reliable wake-up is an actual container size change — nudge
// the width a few times unconditionally (visually imperceptible).
function kickMapResize() {
  if (!map) return;
  const nudge = () => {
    const el = document.getElementById('map');
    if (!el) return;
    el.style.width = 'calc(100% - 1px)';
    setTimeout(() => { el.style.width = ''; }, 120);
  };
  // the stalled tile RPC only responds to a nudge after it gives up,
  // and how long that takes varies — keep nudging for the first 45s
  for (let t = 1500; t <= 45000; t += 3500) setTimeout(nudge, t);
}

let visibleDays = new Set();
let segLines = {};        // dayId -> { segIdx: Polyline }
let drawGen = 0;          // 每次重畫 +1,舊的路線回應直接丟掉
let lastFitKey = '';      // 顯示內容沒變就不重新縮放,避免編輯時地圖一直跳
const dirCache = new Map(); // 起訖點 → 路線結果,重畫時不重複呼叫 API
const skipWarned = new Set();

function clearMap() {
  allMarkers.forEach(m => m.setMap(null));
  allMarkers = [];
  Object.values(segLines).forEach(o => Object.values(o).forEach(l => l.setMap(null)));
  segLines = {};
}

function haversineKm(a, b) {
  const R = 6371, toRad = d => d * Math.PI / 180;
  const s = Math.sin(toRad(b.lat - a.lat) / 2) ** 2 +
    Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(toRad(b.lng - a.lng) / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

// show a day (used by day-card buttons and after edits): ensure visible + focused
window.showDayOnMap = showDayOnMap;
function showDayOnMap(dayId) {
  if (!map || !tripData.days?.[dayId]) return;
  visibleDays.add(dayId);
  activeDay = dayId;
  drawVisibleDays();
}

// map tab: 未顯示 → 顯示並聚焦;已顯示但非聚焦 → 聚焦;聚焦中 → 隱藏
window.toggleDayOnMap = function(dayId) {
  if (!visibleDays.has(dayId)) {
    visibleDays.add(dayId);
    activeDay = dayId;
  } else if (activeDay !== dayId) {
    activeDay = dayId;
  } else {
    visibleDays.delete(dayId);
    activeDay = [...visibleDays].pop() || null;
  }
  renderAll._userHidAll = visibleDays.size === 0;
  drawVisibleDays();
};

function drawVisibleDays() {
  if (!map) return;
  drawGen++;
  clearMap();
  const ri = document.getElementById('route-info');
  if (ri) ri.style.display = 'none';

  const dayKeys = Object.keys(tripData.days || {}).sort();
  [...visibleDays].forEach(d => { if (!tripData.days?.[d]) visibleDays.delete(d); });
  if (activeDay && !visibleDays.has(activeDay)) activeDay = [...visibleDays].pop() || null;
  renderMapTabs(dayKeys);

  const bounds = new google.maps.LatLngBounds();
  let fitCount = 0, markerCount = 0;
  // 非聚焦天數先畫(墊底),聚焦天數最後畫(疊在最上面)
  dayKeys.filter(d => visibleDays.has(d) && d !== activeDay).forEach(d => {
    const r = drawDay(d, false);
    markerCount += r.markers;
    if (!activeDay) r.fitPts.forEach(p => { bounds.extend(p); fitCount++; });
  });
  if (activeDay) {
    const r = drawDay(activeDay, true);
    markerCount += r.markers;
    r.fitPts.forEach(p => { bounds.extend(p); fitCount++; });
  }

  drawPool();

  const navBtn = document.getElementById('map-nav-btn');
  navBtn.style.display = (activeDay && markerCount) ? 'flex' : 'none';

  const fitKey = activeDay + '|' + [...visibleDays].sort().join(',') + '|' + bounds.toUrlValue();
  if (fitKey !== lastFitKey && fitCount) {
    lastFitKey = fitKey;
    if (fitCount === 1) { map.setCenter(bounds.getCenter()); map.setZoom(14); }
    else map.fitBounds(bounds, { top: 60, left: 40, right: 40, bottom: 40 });
  }
  if (activeDay) renderRouteInfo(activeDay);
}

function arrowIcons(color) {
  return [{
    icon: { path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW, scale: 2.6, fillColor: color, fillOpacity: 1, strokeColor: '#fff', strokeWeight: 1 },
    offset: '40px', repeat: '110px'
  }];
}

// 聚焦天數:每一段不同顏色 + 方向箭頭 + 大標記;其他天數:當日顏色、細線、半透明
function drawDay(dayId, focused) {
  const day = tripData.days[dayId];
  const res = { markers: 0, fitPts: [] };
  if (!day) return res;
  const dayKeys = Object.keys(tripData.days).sort();
  const idx = dayKeys.indexOf(dayId);
  const dayColor = DAY_COLORS[idx % DAY_COLORS.length];
  // 編號跟左側清單一致(沒定位的景點不重新編號)
  const spots = getSpotsArray(day).map((s, i) => ({ ...s, num: i + 1 })).filter(s => s.lat && s.lng);
  if (spots.length === 0) return res;

  const gen = drawGen;
  const useAvoidTolls = spots.some(s => s.avoidToll);
  routeStats[dayId] = {};
  segLines[dayId] = {};
  const byPos = new Map();   // 同一地點(例如出發/回到同一間飯店)合併成「1/5」,避免互相蓋住

  spots.forEach((sp, i) => {
    const pk = sp.lat.toFixed(5) + ',' + sp.lng.toFixed(5);
    const prev = byPos.get(pk);
    if (prev) {
      prev.nums.push(sp.num);
      const t = prev.nums.join('/');
      prev.marker.setLabel({ ...prev.marker.getLabel(), text: t });
      if (prev.tag) prev.tag.setLabel({ ...prev.tag.getLabel(), text: t + prev.tag.getLabel().text.replace(/^[\d/]+/, '') });
    } else {
      byPos.set(pk, { nums: [sp.num], ...addMarker(sp, sp.num, dayColor, SPOT_TYPES[sp.type]?.icon || '📍', focused) });
    }
    res.markers++;
    if (i === spots.length - 1) return;

    const next = spots[i + 1];
    const segColor = focused ? SEGMENT_COLORS[i % SEGMENT_COLORS.length] : dayColor;
    const stat = { fromNum: sp.num, toNum: next.num, from: sp.name, to: next.name, color: segColor };
    routeStats[dayId][i] = stat;

    const distKm = haversineKm(sp, next);
    if (distKm > 300) {   // 跨海/飛機段:不畫,只在面板標示
      stat.skipped = true;
      stat.distText = `${Math.round(distKm).toLocaleString()} 公里`;
      const warnKey = dayId + i;
      if (focused && !skipWarned.has(warnKey)) {
        skipWarned.add(warnKey);
        showToast(`Day ${idx+1} ${sp.num}→${next.num} 距離 ${Math.round(distKm)}km,視為飛機/渡輪段不畫路線`);
      }
      return;
    }
    res.fitPts.push({ lat: sp.lat, lng: sp.lng }, { lat: next.lat, lng: next.lng });

    const key = `${sp.lat},${sp.lng}>${next.lat},${next.lng}|${useAvoidTolls ? 1 : 0}`;
    const paint = result => {
      if (gen !== drawGen) return;           // 已經重畫過,這是舊請求
      let path, dashed = false;
      const leg = result?.routes?.[0]?.legs?.[0];
      if (leg) {
        path = result.routes[0].overview_path;
        stat.durText = leg.duration?.text || '';
        stat.durVal  = leg.duration?.value || 0;
        stat.distText = leg.distance?.text || '';
      } else {                                // 查不到路線:虛線直連
        path = [{ lat: sp.lat, lng: sp.lng }, { lat: next.lat, lng: next.lng }];
        dashed = true;
        stat.failed = true;
      }
      segLines[dayId][i] = new google.maps.Polyline({
        path, map,
        strokeColor: segColor,
        strokeOpacity: dashed ? 0 : (focused ? 0.95 : 0.4),
        strokeWeight: focused ? 6 : 3,
        zIndex: focused ? 20 : 5,
        icons: dashed
          ? [{ icon: { path: 'M 0,-1 0,1', strokeOpacity: .9, strokeColor: segColor, scale: 3 }, offset: '0', repeat: '14px' }]
          : (focused ? arrowIcons(segColor) : [])
      });
      if (focused) renderRouteInfo(dayId);
    };

    if (dirCache.has(key)) { paint(dirCache.get(key)); return; }
    directionsService.route({
      origin:      { lat: sp.lat,   lng: sp.lng },
      destination: { lat: next.lat, lng: next.lng },
      travelMode:  google.maps.TravelMode.DRIVING,
      avoidTolls:  useAvoidTolls,
    }, (result, status) => {
      if (status === 'OK') { dirCache.set(key, result); paint(result); }
      else paint(null);
    });
  });
  return res;
}

const SEGMENT_COLORS = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff922b','#cc5de8','#20c997','#f06595','#a9e34b','#74c0fc'];

// ── ROUTE INFO PANEL ──────────────────────────
let routeStats = {};

function renderRouteInfo(dayId) {
  const el = document.getElementById('route-info');
  const stats = routeStats[dayId];
  if (!stats || Object.keys(stats).length === 0) { el.style.display = 'none'; return; }
  const segIdxs = Object.keys(stats).map(Number).sort((a, b) => a - b);
  const totalMin = Math.round(segIdxs.reduce((s, k) => s + (stats[k].durVal || 0), 0) / 60);
  const totalTxt = totalMin >= 60 ? `${Math.floor(totalMin/60)} 小時 ${totalMin%60} 分` : `${totalMin} 分`;
  const dayNum = Object.keys(tripData.days).sort().indexOf(dayId) + 1;
  el.innerHTML = `<div class="ri-total">Day ${dayNum}｜🚗 總車程約 ${totalTxt}</div>` +
    segIdxs.map(k => {
      const x = stats[k];
      const info = x.skipped ? `✈️ 不畫路線(${x.distText})`
        : x.failed ? '⚠️ 查不到路線(虛線)'
        : x.durText ? `${x.durText}・${x.distText}` : '計算中…';
      return `<div class="ri-seg" onclick="focusSegment('${dayId}',${k})" title="點一下放大這段">
        <span class="ri-sw" style="background:${x.color}"></span>
        <span class="ri-names"><b>${x.fromNum}</b> ${esc(x.from||'')} → <b>${x.toNum}</b> ${esc(x.to||'')}</span>
        <span class="ri-dur">${info}</span>
      </div>`;
    }).join('');
  el.style.display = 'block';
}

// 點面板上的某一段:放大到那段並加粗閃一下
window.focusSegment = function(dayId, segIdx) {
  const line = segLines[dayId]?.[segIdx];
  if (!line) return;
  const b = new google.maps.LatLngBounds();
  line.getPath().forEach(p => b.extend(p));
  map.fitBounds(b, { top: 80, left: 40, right: 40, bottom: 40 });
  const w = line.get('strokeWeight');
  line.setOptions({ strokeWeight: w + 5, zIndex: 30 });
  setTimeout(() => line.setOptions({ strokeWeight: w, zIndex: 20 }), 1500);
};

function addMarker(sp, num, color, icon, focused = true) {
  const infoContent = `
    <div style="font-family:'Noto Sans TC',sans-serif;padding:6px 8px;min-width:140px;background:#1e2235;color:#e6edf3;border-radius:8px">
      <div style="font-size:13px;font-weight:700;margin-bottom:4px">${num}. ${icon} ${esc(sp.name||'')}</div>
      ${sp.time ? `<div style="font-size:11px;color:#8b949e">⏰ ${sp.time}</div>` : ''}
      ${sp.note ? `<div style="font-size:11px;color:#8b949e">📝 ${esc(sp.note)}</div>` : ''}
      ${sp.cost ? `<div style="font-size:11px;color:#d4a843">💴 ${Number(sp.cost).toLocaleString()} ${sp.costCurrency||''}</div>` : ''}
    </div>`;
  const iw = new google.maps.InfoWindow({ content: infoContent });

  const marker = new google.maps.Marker({
    position: { lat: sp.lat, lng: sp.lng },
    map,
    title: `${num}. ${sp.name}`,
    label: { text: String(num), color:'#fff', fontWeight:'bold', fontSize: focused ? '12px' : '9px' },
    icon: {
      path: google.maps.SymbolPath.CIRCLE,
      fillColor: color, fillOpacity: focused ? 1 : 0.55,
      strokeColor: '#fff', strokeWeight: focused ? 2.5 : 1.5, scale: focused ? 15 : 10
    },
    zIndex: focused ? 200 + num : 50
  });
  marker.addListener('click', () => iw.open(map, marker));
  allMarkers.push(marker);

  // 聚焦天數:標記上方加「編號 名稱」小標籤,一眼看出第幾站是哪裡
  let tag = null;
  if (focused && sp.name) {
    tag = new google.maps.Marker({
      position: { lat: sp.lat, lng: sp.lng },
      map,
      clickable: false,
      icon: { path: 'M 0,0', scale: 0 },
      label: { text: `${num}. ${sp.name.length > 12 ? sp.name.slice(0, 12) + '…' : sp.name}`, className: 'mk-name', color: '#fff', fontSize: '11px', fontWeight: '600' },
      zIndex: 300 + num
    });
    allMarkers.push(tag);
  }
  return { marker, tag };
}

window.openNavigation = function() {
  if (!activeDay || !tripData.days[activeDay]) return;
  const spots = getSpotsArray(tripData.days[activeDay]).filter(s => s.lat && s.lng);
  if (spots.length === 0) { showToast('請先新增景點'); return; }
  const useAvoidTolls = spots.some(s => s.avoidToll);
  const origin = `${spots[0].lat},${spots[0].lng}`;
  const dest   = `${spots[spots.length-1].lat},${spots[spots.length-1].lng}`;
  const wpts   = spots.slice(1,-1).map(s=>`${s.lat},${s.lng}`).join('|');
  let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}&travelmode=driving`;
  if (wpts) url += `&waypoints=${encodeURIComponent(wpts)}`;
  if (useAvoidTolls) url += `&avoid=tolls`;
  window.open(url, '_blank');
};

// ── GEOCODE ───────────────────────────────────
function saveSpotLocation(dayId, spotId, name, lat, lng, placeId) {
  if (!tripData.days[dayId]?.spots?.[spotId]) return;
  tripData.days[dayId].spots[spotId].lat = lat;
  tripData.days[dayId].spots[spotId].lng = lng;
  if (placeId) tripData.days[dayId].spots[spotId].placeId = placeId;
  save();
  if (activeDay === dayId) showDayOnMap(dayId);
  showToast(`已定位「${name}」📍`);
}

// Business/POI names resolve much better via Places search than the
// address-oriented Geocoder, so try Places first and fall back.
function findPlace(name, onFound, onFail) {
  if (!window.google || !map) { showToast('地圖尚未載入，請稍後再試 🗺'); return; }
  const svc = new google.maps.places.PlacesService(map);
  svc.findPlaceFromQuery({ query: name, fields: ['name','geometry','place_id'] }, (results, status) => {
    const p = results?.[0];
    if (status === google.maps.places.PlacesServiceStatus.OK && p?.geometry) {
      onFound({ lat: p.geometry.location.lat(), lng: p.geometry.location.lng(), placeId: p.place_id });
    } else {
      geocodeFallback(name, false, onFound, onFail);
    }
  });
}

function geocodeFallback(name, retried, onFound, onFail) {
  new google.maps.Geocoder().geocode({ address: retried ? name + ' 日本' : name, region: 'jp' }, (results, status) => {
    if (status === 'OK' && results[0]) {
      const loc = results[0].geometry.location;
      onFound({ lat: loc.lat(), lng: loc.lng(), placeId: null });
    } else if (status === 'ZERO_RESULTS' && !retried) {
      geocodeFallback(name, true, onFound, onFail);
    } else {
      console.warn('Geocode failed:', name, status);
      onFail?.();
    }
  });
}

function geocodeAndSave(dayId, spotId, name) {
  findPlace(name,
    p => saveSpotLocation(dayId, spotId, name, p.lat, p.lng, p.placeId),
    () => showToast(`找不到「${name}」的位置，請換個名稱試試`));
}

function geocodeSpot(dayId, spotId, name) { if (name) geocodeAndSave(dayId, spotId, name); }

// ── BUDGET BAR ────────────────────────────────
function updateBudgetBar() {
  // 預估 = 行程裡景點填的費用;實際 = 費用頁的記帳。剩餘以實際計算
  let est = 0;
  if (tripData.days) Object.values(tripData.days).forEach(d => {
    if (d.spots) Object.values(d.spots).forEach(s => {
      est += toBase(parseFloat(s.cost)||0, s.costCurrency||baseCurrency);
    });
  });
  const actual = Object.values(expensesCache).reduce((s, e) => s + toBase(parseFloat(e.amount)||0, e.currency||baseCurrency), 0);
  const budget = parseFloat(tripData.budget) || 0;
  const remain = budget - actual;
  const pct    = budget > 0 ? Math.min(actual / budget * 100, 100) : 0;
  const sym = symbolFor(baseCurrency);

  const budgetLbl = document.getElementById('budget-cur-lbl');
  if (budgetLbl) budgetLbl.textContent = baseCurrency;
  document.getElementById('est-val').textContent    = `${sym}${Math.round(est).toLocaleString()}`;
  document.getElementById('est-val').style.color    = budget > 0 && est > budget ? '#f85149' : 'var(--gold)';
  document.getElementById('actual-val').textContent = `${sym}${Math.round(actual).toLocaleString()}`;
  document.getElementById('remain-val').textContent = `${sym}${Math.abs(Math.round(remain)).toLocaleString()}`;
  document.getElementById('remain-lbl').textContent = remain >= 0 ? '剩餘' : '超支';
  document.getElementById('remain-val').style.color = remain >= 0 ? '#39d353' : '#f85149';
  document.getElementById('budget-bar-fill').style.width = pct + '%';
  document.getElementById('budget-bar-fill').style.background = pct > 90 ? '#f85149' : 'linear-gradient(90deg,#4a7c59,#d4a843)';
  const mark = document.getElementById('budget-est-mark');
  mark.style.display = budget > 0 && est > 0 ? 'block' : 'none';
  mark.style.left = `calc(${Math.min(est / (budget || 1) * 100, 100)}% - 2px)`;
}

// ── LONG-PRESS DRAG REORDER (touch + mouse) ───
// Hold a card ~400ms to lift it, drag vertically, release to drop.
// Moving >10px before the hold completes is treated as scrolling.
function initSpotDrag() {
  const container = document.getElementById('days-container');
  let blockScroll = null;

  container.addEventListener('pointerdown', e => {
    if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
    if (['INPUT','SELECT','TEXTAREA','BUTTON','OPTION','A','LABEL'].includes(e.target.tagName)) return;
    const item = e.target.closest('.spot-item');
    if (!item) return;

    const dayId = item.dataset.day, spotId = item.dataset.spot;
    const startX = e.clientX, startY = e.clientY;
    let active = false;

    const timer = setTimeout(() => {
      active = true;
      navigator.vibrate?.(30);
      item.classList.add('touch-dragging');
      document.body.classList.add('no-select');
      blockScroll = ev => ev.preventDefault();
      document.addEventListener('touchmove', blockScroll, { passive: false });
    }, 400);

    const list = item.parentElement;
    const clearOver = () => list.querySelectorAll('.spot-item').forEach(s => s.classList.remove('drag-over'));

    const onMove = ev => {
      if (!active) {
        if (Math.abs(ev.clientY - startY) > 10 || Math.abs(ev.clientX - startX) > 10) cleanup();
        return;
      }
      item.style.transform = `translateY(${ev.clientY - startY}px) scale(1.02)`;
      clearOver();
      const over = [...list.querySelectorAll('.spot-item')].find(s => {
        if (s === item) return false;
        const r = s.getBoundingClientRect();
        return ev.clientY > r.top && ev.clientY < r.bottom;
      });
      if (over) over.classList.add('drag-over');
    };

    const onUp = ev => {
      const wasActive = active;
      const dropY = ev.clientY;
      cleanup();
      if (!wasActive) return;
      window.__justDragged = true;
      setTimeout(() => { window.__justDragged = false; }, 400);
      const spots = tripData.days[dayId]?.spots;
      if (!spots) return;
      const keys = Object.keys(spots).sort();
      const from = keys.indexOf(spotId);
      if (from < 0) return;
      // insertion index = number of other cards whose midpoint is above the drop point
      const others = [...list.querySelectorAll('.spot-item')].filter(s => s !== item);
      let to = others.filter(s => {
        const r = s.getBoundingClientRect();
        return (r.top + r.height / 2) < dropY;
      }).length;
      if (to === from) return;
      keys.splice(from, 1);
      keys.splice(to, 0, spotId);
      rekeySpots(dayId, keys);
      save();
      showToast('順序已更新 ✓');
      setTimeout(() => showDayOnMap(dayId), 300);
    };

    function cleanup() {
      clearTimeout(timer);
      active = false;
      item.classList.remove('touch-dragging');
      item.style.transform = '';
      document.body.classList.remove('no-select');
      clearOver();
      if (blockScroll) { document.removeEventListener('touchmove', blockScroll); blockScroll = null; }
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
    }

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });
}
initSpotDrag();

// ── OPENING HOURS CHECK ────────────────────────
// Google's opening_hours.periods use day 0=Sunday..6=Saturday, matching
// JS Date#getDay(), so trip dates can be checked directly against them.
function toMin(t) { return parseInt(t.slice(0,2), 10) * 60 + parseInt(t.slice(2,4), 10); }
function fmtTime(t) { return t.slice(0,2) + ':' + t.slice(2,4); }

function isSpotClosed(poiId, dateStr, timeStr) {
  const periods = poisCache[poiId]?.openingHours?.periods;
  if (!periods || !periods.length || !dateStr || !timeStr) return null; // unknown
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d)) return null;
  const dow = d.getDay();
  const [hh, mm] = timeStr.split(':').map(Number);
  const targetWk = dow * 1440 + hh * 60 + mm;

  let alwaysOpen = false;
  const intervals = [];
  periods.forEach(p => {
    if (!p.open) return;
    const openWk = p.open.day * 1440 + toMin(p.open.time);
    if (!p.close) { alwaysOpen = true; return; }
    let closeWk = p.close.day * 1440 + toMin(p.close.time);
    if (closeWk <= openWk) closeWk += 7 * 1440;
    intervals.push([openWk, closeWk]);
  });
  if (alwaysOpen) return false;

  for (const [o, c] of intervals) {
    if (targetWk >= o && targetWk < c) return false;
    if (targetWk + 7 * 1440 >= o && targetWk + 7 * 1440 < c) return false; // prev-week wrap
  }
  return true; // closed
}

function hoursTextForDow(poiId, dow) {
  const periods = poisCache[poiId]?.openingHours?.periods;
  if (!periods) return '';
  const wins = periods.filter(p => p.open && p.open.day === dow).map(p => {
    if (!p.close) return `${fmtTime(p.open.time)}–24 小時營業`;
    return `${fmtTime(p.open.time)}–${fmtTime(p.close.time)}`;
  });
  return wins.length ? wins.join('、') : '公休';
}

function compressImage(file, maxSide = 1600, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * scale);
      cv.height = Math.round(img.height * scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(b => b ? resolve(b) : reject(new Error('compress failed')), 'image/jpeg', quality);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

window.uploadPhotos = async function(files) {

  let done = 0;

      hint.textContent = `上傳中… ${done+1}/${files.length}`;
      const blob = await compressImage(file);
      const photoId = 'ph_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
      const path = `projects/${projectId}/days/${photoDay}/${photoId}.jpg`;
      await uploadBytes(sRef(storage, path), blob, { contentType: 'image/jpeg' });
      const url = await getDownloadURL(sRef(storage, path));
      await set(ref(db, `photos/${projectId}/${photoDay}/${photoId}`), {
        kind: photoTab, url, storagePath: path,
        uploadedBy: currentUser.uid, uploaderName: currentUd?.name || '',
        uploadedAt: Date.now()
      });
      done++;
    } catch (e) {
      console.error('upload failed:', e);
      showToast(e.code === 'storage/unknown' || e.code === 'storage/unauthorized'
        ? '上傳失敗：Firebase Storage 尚未開通（需 Blaze 方案）'
        : '上傳失敗：' + (e.message || e));
      break;
    }
  }
  hint.textContent = '自動壓縮後上傳';
  document.getElementById('pm-file').value = '';

  const rows = Object.entries(users)
    .filter(([, u]) => u.status === 'approved' || u.isAdmin)
    .map(([uid, u]) => {
      const isOwner = projectMeta.ownerId === uid;
      const inProj = isOwner || members[uid]?.status === 'approved';
      return `<label class="member-row">
        <input type="checkbox" ${inProj ? 'checked' : ''} ${isOwner ? 'disabled' : ''}
          onchange="toggleMember('${uid}', this.checked)">
        <img class="member-photo" src="${u.photo || ''}" onerror="this.style.display='none'">
        <span class="member-name">${esc(u.name || u.email || uid)}</span>
        <span class="member-tag">${isOwner ? '建立者' : (u.isAdmin ? '管理員' : '')}</span>
      </label>`;
    });
  document.getElementById('members-list').innerHTML = rows.join('');
  document.getElementById('members-empty').style.display = rows.length > 1 ? 'none' : 'block';
  document.getElementById('members-modal-mask').classList.add('open');
};

window.closeMembers = function() {
  document.getElementById('members-modal-mask').classList.remove('open');
};

window.toggleMember = async function(uid, add) {
  try {
    const uSnap = await get(ref(db, `users/${uid}`));
    const u = uSnap.val() || {};
    if (add) {
      await set(ref(db, `projects/${projectId}/members/${uid}`),
        { status: 'approved', role: 'member', name: u.name || u.email || '' });
      showToast(`已加入成員：${u.name || ''} ✓`);
    } else {
      await remove(ref(db, `projects/${projectId}/members/${uid}`));
      showToast(`已移除成員：${u.name || ''}`);
    }
    const mSnap = await get(ref(db, `projects/${projectId}/members`));
    const count = Object.keys(mSnap.val() || {}).length;
    await update(ref(db, `projects/${projectId}`), { memberCount: count });
  } catch (e) {
    console.error(e);
    showToast('成員更新失敗：' + (e.message || e));
  }
};

// ── SHARE ─────────────────────────────────────
window.copyShare = function() {
  navigator.clipboard.writeText(window.location.href).then(() => showToast('連結已複製 🎉'));
};

// ── UTILS ─────────────────────────────────────
function esc(str) { return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}
window.showToast = showToast;
</script>

/* ── MOBILE ── */
@media (max-width: 768px) {
  .main { grid-template-columns: 1fr; position: relative; }

  #map-panel.map-open {
    transform: translateX(0);

  /* dvh: 扣掉手機網址列,避免底部被切 */

  /* 工具列:單行橫向捲動 */
  #itinerary-panel { padding: 10px; gap: 10px; }

  .btn-add-day, .btn-share { padding: 10px 14px; font-size: .85rem; white-space: nowrap; flex-shrink: 0; }

  /* DAY 標頭 */
  .day-pill { font-size:.72rem; }

  /* 景點卡:類型圖示與下拉重複 → 隱藏圖示;名稱獨佔一行;備註換到第三行 */

  .spot-name-inp { min-width: 0; flex: 1 1 100%; font-weight: 600; }
  .spot-type-sel { padding: 4px 6px; }
  .spot-row2 { gap: 6px 8px; }
  .spot-time { width: 110px; color: var(--text); }
  .spot-cost { width: 80px; }
  .spot-cur-sel { padding: 3px 2px; }
  .spot-note { order: 3; flex: 1 1 100%; padding: 6px 8px; }
  .spot-warn { font-size: .78rem; }
  .spot-side { gap: 6px; }
  .btn-spot-nav, .btn-spot-toggle { width: 40px; height: 40px; font-size: 1.05rem; }
  .sc-name { font-size: .98rem; }
  .sc-row2 { font-size: .8rem; }
  .spot-edit { padding-left: 0; }
  .se-field { font-size: .74rem; }

  .se-actions .btn-ic, .se-actions .spot-move-sel { min-height: 40px; }
  .pool-hd { padding: 12px; font-size: .88rem; }
  .pool-item { padding: 10px 12px; font-size: .92rem; }
  #undo-bar { bottom: 90px; }
  .form-row { flex-wrap: wrap; }

  /* 新增列 */
  .add-spot-row { padding: 10px; flex-wrap: wrap; }

  /* 地圖:手機的景點詳情是整頁跳轉,切換籤用不到 */

  .map-day-tabs { max-width: calc(100% - 24px); }

          <button class="pm-upload-btn" id="info-save-btn" onclick="saveInfoItem()">＋ 新增</button>
          <button class="btn-share" id="info-cancel-btn" style="display:none" onclick="resetInfoForm()">取消編輯</button>
          <input type="file" id="info-file" multiple style="display:none" onchange="uploadInfoDocs(this.files)">
          <button class="btn-share" onclick="document.getElementById('info-file').click()" title="上傳到上方選的分類">📎 上傳檔案</button>
        </div>
        <div class="pm-hint">上傳的檔案會放進上方選的分類(PDF、圖片等,每個 ≤10MB)</div>
      </div>
    </div>
  </div>
</div>

<!-- CHECKLIST MODAL (行前清單) -->
<div class="modal-mask" id="check-modal-mask" onclick="if(event.target===this)closeChecklist()">
  <div class="photo-modal" style="width:480px">
    <div class="pm-head">
      <span class="pm-title">✅ 行前清單</span>
      <button class="pm-close" onclick="closeChecklist()">✕</button>
    </div>
    <div class="pm-body">
      <div class="form-row">
        <input id="check-new" placeholder="新增項目後 Enter(例:換日幣、買網卡)" style="flex:1" onkeydown="if(event.key==='Enter')addCheckItem()">
        <button class="pm-upload-btn" onclick="addCheckItem()">新增</button>
      </div>
      <div id="check-list"></div>
    </div>
  </div>
</div>

<!-- UNDO BAR -->
<div id="undo-bar"><span id="undo-text"></span><button onclick="doUndo()">復原</button></div>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="this.classList.remove('open')"><img id="lightbox-img" src="" alt=""></div>

<div class="toast" id="toast"></div>

<!-- Google Maps -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC-QgKIKtZkmWIOXawmGBHVci4kKJOF7W0&callback=initMap&libraries=places,geometry&loading=async" async defer></script>
</body>
</html>
